<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D-Lish's Food Products</title>
    <meta name="description" content="D-Lish's Food Products" />
    <meta name="author" content="Diane Lish" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Birthstone&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../images/favicon-32x32.png"
    />
    <script src="../scripts/cart.js" type="module"></script>
  </head>

  <body>
    <header class="main-header">
      <div>
        <img
          src="../images/d-lishs-logo.png"
          alt="D-Lish's Food Logo"
          width="150"
          height="150"
        />
        <div>
          <a href="#" id="menu"></a>
          <div class="shopping-cart">
            <a href="#"
              ><img
                src="../images/cart-logo.svg"
                alt="Shopping Cart Icon"
                width="50"
                height="50"
            /></a>
            <div id="item-number"></div>
          </div>
        </div>
      </div>
      <nav>
        <ul id="navigation">
          <li><a href="../index.html">Home</a></li>
          <li><a href="../products/products.html">Products</a></li>
          <li><a href="../recipes/recipes.html">Recipes</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="cart"></section>

      <dialog id="order-form">
        <button class="close">Close</button>
        <form action="success.html" method="get">
          <h3>Grocery Order Form</h3>
          <p>Required <span class="required">*</span></p>

          <fieldset>
            <legend>Personal Information</legend>
            <label
              ><input
                id="fname"
                name="fname"
                type="text"
                required
                title="Please enter your first name."
                autocomplete="given-name"
              />First Name <span class="required">*</span></label
            >
            <label
              ><input
                id="lname"
                name="lname"
                type="text"
                required
                title="Please enter your last name."
                autocomplete="family-name"
              />Last Name <span class="required">*</span></label
            >
            <label
              ><input
                id="phone"
                name="phone"
                type="tel"
                required
                title="Please enter a valid phone number."
                autocomplete="tel"
              />Phone Number <span class="required">*</span></label
            >
          </fieldset>

          <fieldset>
            <legend>Payment Information</legend>
            <label
              ><input
                id="cc-number"
                name="cc-number"
                type="text"
                required
                pattern="[0-9]{15,16}"
                maxlength="16"
                title="Please enter your 16 digit credit card number."
              />Credit Card Number <span class="required">*</span></label
            >
            <label
              ><input
                id="cvs"
                name="cvs"
                type="text"
                required
                pattern="[0-9]{3,4}"
                maxlength="3"
                placeholder="XXX"
                title="Please enter the three digit number on the back of your card."
              />CVS <span class="required">*</span></label
            >
            <label
              ><input
                id="exp"
                name="exp"
                type="text"
                required
                maxlength="5"
                placeholder="MM/YY"
                pattern="(0[1-9]|1[0-2])\/\d{2}"
                title="Please enter your card's expiration date.(XX-XX)"
              />Experation <span class="required">*</span></label
            >
          </fieldset>

          <input type="hidden" name="timestamp" id="timestamp" />
          <div id="form-total"></div>
          <button class="order-submit" type="submit">Place Order</button>
        </form>
      </dialog>
    </main>

    <footer class="main-footer">
      <p>
        ©<span id="currentYear"></span> 🌷 Diane Lish | United States <br />
        Last Modified <span id="lastModified"></span>
      </p>

      <div class="social-media">
        <a href="https://www.youtube.com/"
          ><img
            src="../images/youtube-logo.svg"
            alt="Youtube logo"
            width="30"
            height="30"
            loading="lazy"
        /></a>
        <a href="https://x.com/"
          ><img
            src="../images/twitter-logo.svg"
            alt="Twitter logo"
            width="30"
            height="30"
            loading="lazy"
        /></a>
        <a href="https://www.facebook.com/"
          ><img
            src="../images/facebook-logo.svg"
            alt="Facebook logo"
            width="30"
            height="30"
            loading="lazy"
        /></a>
      </div>
    </footer>
  </body>
</html>
